name: Go CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        # What it does: downloads the project files from GitHub to the runner.
        # Used for: so GitHub can access and work with your app code.
        uses: actions/checkout@v4

      - name: Set up Go
        # What it does: installs Go on the machine running the workflow.
        # Used for: so the project can be built and tested with the Go language.
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        # What it does: downloads the libraries/packages your app needs.
        # Used for: so the code can compile and run correctly.
        run: go mod download

      - name: Run tests
        # What it does: runs the project test cases.
        # Used for: to check whether the app is still working and catch errors.
        run: go test ./...

      - name: Build application
        # What it does: compiles the Go app into an executable file.
        # Used for: to confirm the app can be built successfully.
        run: go build -o ecommerce ./cmd

      - name: Build Docker image
        # What it does: creates a Docker image of the app.
        # Used for: so the app can run in a container and be deployed easily.
        run: docker build -t ecommerce-api .

      - name: Log in to GitHub Container Registry
        # What it does: signs in to GitHub's container registry.
        # Used for: so the Docker image can be uploaded to GitHub Packages.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        # What it does: gives the Docker image a proper GitHub name/tag.
        # Used for: so GitHub knows where to store and identify the image.
        run: docker tag ecommerce-api ghcr.io/babarmaqsood10/ecommerce-api:latest

      - name: Push Docker image
        # What it does: uploads the Docker image to GitHub Packages.
        # Used for: so the image can be shared and deployed easily.
        run: docker push ghcr.io/babarmaqsood10/ecommerce-api:latest