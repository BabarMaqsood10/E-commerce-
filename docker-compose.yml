services:
  db:
    image: mysql:8.0
    container_name: myproject_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DBName}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
